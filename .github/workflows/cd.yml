name: cd

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Clone the SDK over HTTPS
        run: |
          git config --local --unset-all http.https://github.com/.extraheader || true
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global url."https://github.com/".insteadOf "git@github.com:"
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run check
      - name: Plan the release
        id: plan
        run: bun scripts/release.ts plan
      - name: Build the linux binary
        if: steps.plan.outputs.action == 'publish'
        run: |
          bun build ./src/main.ts --compile --target=bun-linux-x64 --outfile financeiro-linux-x64
          sha256sum financeiro-linux-x64 > financeiro-linux-x64.sha256
      - name: Publish the release
        if: steps.plan.outputs.action == 'publish'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.plan.outputs.version }}
          name: v${{ steps.plan.outputs.version }}
          body_path: ${{ steps.plan.outputs.notes_file }}
          target_commitish: ${{ github.sha }}
          files: |
            financeiro-linux-x64
            financeiro-linux-x64.sha256
      - name: Write the release files
        if: steps.plan.outputs.action == 'pr'
        run: bun scripts/release.ts write
      - name: Open the release pull request
        if: steps.plan.outputs.action == 'pr'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: chore/release
          base: main
          commit-message: chore: publica ${{ steps.plan.outputs.version }}
          title: chore: publica ${{ steps.plan.outputs.version }}
          body-path: ${{ steps.plan.outputs.notes_file }}
          add-paths: |
            package.json
            CHANGELOG.md
            README.md
          committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
